name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # -x follows sourced files; -P SCRIPTDIR resolves the $(dirname ...)
          # source path in each script back to scripts/lib.sh.
          shellcheck -x -P SCRIPTDIR scripts/*.sh

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet ruff pyright
      - run: ruff check tools/
      - run: ruff format --check tools/
      - run: pyright tools/
